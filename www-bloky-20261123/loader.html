<!doctype html><meta charset="utf-8"><title>loader</title>
<script>
// Docasny predavac bloku do editoru Webnode (23. 11. 2026). Posle obsah jen oknu, ktere ho otevrelo, a jen na adresu editoru markmade.
(async function () {
  var slug = new URLSearchParams(location.search).get('slug') || '';
  var target = 'https://markmade-cz.cms.webnode.cz';
  try {
    var body = await (await fetch(slug + '.html?x=' + Date.now(), { cache: 'no-store' })).text();
    window.opener && window.opener.postMessage({ mmBlok: slug, body: body }, target);
    document.title = 'ok ' + body.length;
  } catch (e) {
    window.opener && window.opener.postMessage({ mmBlok: slug, err: String(e) }, target);
  }
})();
</script>
